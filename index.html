<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Domain Explorer — DNS &amp; Subdomain Lookup</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg: #14161A;
  --surface: #1C1F25;
  --surface-2: #23272F;
  --line: #2C313B;
  --accent: #6DA5FF;
  --accent-soft: rgba(109,165,255,.12);
  --teal: #4FD1A5;
  --text: #EDEFF2;
  --muted: #8E97A3;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{min-height:100vh;}

.wrap{max-width:920px;margin:0 auto;padding:48px 20px 70px;}

.hero{margin-bottom:28px;}
h1{font-size:clamp(24px,3.4vw,30px);font-weight:700;margin:0 0 8px;letter-spacing:-.01em;}
.sub{color:var(--muted);font-size:14.5px;line-height:1.55;max-width:58ch;margin:0;}

/* ---------- FORM ---------- */
.panel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:22px;margin-bottom:18px;}
.form-row{display:flex;gap:10px;flex-wrap:wrap;}
input[type=text]{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--line);color:var(--text);
  font-family:var(--sans);font-size:14.5px;padding:12px 14px;border-radius:7px;outline:none;transition:border-color .15s;}
input[type=text]:focus{border-color:var(--accent);}
input[type=text]::placeholder{color:#5C6470;}
button{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:12px 20px;
  border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#0E1220;cursor:pointer;
  transition:opacity .15s, transform .1s;}
button:hover{opacity:.9;}
button:active{transform:translateY(1px);}
button:disabled{opacity:.4;cursor:not-allowed;}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
button.ghost:hover{color:var(--text);border-color:var(--muted);opacity:1;}

/* status */
.status-line{font-size:13px;color:var(--muted);margin-top:14px;}
.status-line b{color:var(--teal);font-weight:600;}

/* tabs */
.tabs{display:flex;gap:4px;margin:22px 0 0;border-bottom:1px solid var(--line);}
.tab{font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--muted);
  padding:10px 4px;margin-right:22px;cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}

.tabpanel{display:none;padding-top:18px;}
.tabpanel.active{display:block;}

/* ---------- RESULTS ---------- */
.result-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.count{font-size:13px;color:var(--muted);}
.count b{color:var(--text);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;
  padding:9px 10px;border-bottom:1px solid var(--line);}
tbody td{padding:10px;border-bottom:1px solid var(--surface-2);color:var(--text);font-family:var(--mono);font-size:13px;}
tbody tr:hover{background:var(--surface-2);}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-family:var(--sans);font-weight:500;}
.badge.a{background:rgba(79,209,165,.12);color:var(--teal);}
.badge.cname{background:rgba(109,165,255,.12);color:var(--accent);}
.badge.mx{background:rgba(240,180,90,.12);color:#F0B45A;}
.badge.txt{background:rgba(255,255,255,.06);color:var(--muted);}
.badge.ns{background:rgba(255,255,255,.06);color:var(--muted);}
.empty{color:var(--muted);font-size:13.5px;padding:30px 4px;text-align:center;border:1px dashed var(--line);border-radius:8px;}
.log{font-size:12px;color:#5C6470;margin-top:10px;min-height:16px;}

::selection{background:var(--accent);color:#0E1220;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <h1>Domain Explorer</h1>
    <p class="sub">Cari subdomain dan lihat seluruh DNS record dari sebuah domain, langsung dari browser.</p>
  </div>

  <div class="panel">
    <div class="form-row">
      <input type="text" id="domainInput" placeholder="contoh: example.com">
      <button id="scanBtn">Jalankan</button>
      <button class="ghost" id="exportBtn" disabled>Ekspor CSV</button>
    </div>
    <div class="status-line" id="statusLine">Masukkan domain untuk mulai.</div>

    <div class="tabs">
      <button class="tab active" data-tab="sub">Subdomain</button>
      <button class="tab" data-tab="dns">DNS Records</button>
    </div>

    <div class="tabpanel active" id="tab-sub">
      <div class="result-meta">
        <span class="count">Ditemukan: <b id="subCount">0</b> subdomain</span>
      </div>
      <div id="subResults"><div class="empty">Belum ada hasil.</div></div>
      <div class="log" id="subLog"></div>
    </div>

    <div class="tabpanel" id="tab-dns">
      <div class="result-meta">
        <span class="count">Record ditemukan: <b id="dnsCount">0</b></span>
      </div>
      <div id="dnsResults"><div class="empty">Belum ada hasil.</div></div>
    </div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const domainInput = $('domainInput');
const scanBtn = $('scanBtn');
const exportBtn = $('exportBtn');
const statusLine = $('statusLine');
const subResults = $('subResults');
const dnsResults = $('dnsResults');
const subCount = $('subCount');
const dnsCount = $('dnsCount');
const subLog = $('subLog');

let lastSubdomainRows = [];

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $('tab-' + t.dataset.tab).classList.add('active');
  });
});

const WORDLIST = ["www","mail","ftp","webmail","smtp","pop","ns1","ns2","ns3","ns4","autodiscover","autoconfig","m","blog",
"dev","test","staging","admin","portal","api","app","apps","cdn","cpanel","webdisk","shop","store","support","help",
"vpn","remote","mx","mx1","mx2","imap","secure","ssl","docs","cloud","git","gitlab","jenkins","ci","status","stats",
"dashboard","panel","beta","demo","sandbox","internal","intranet","extranet","partner","partners","media","images",
"static","assets","download","downloads","files","upload","uploads","backup","db","database","sql","mysql","redis",
"cache","proxy","gateway","gw","lb","load","web","web1","web2","server","host","node","node1","node2","cluster",
"k8s","kube","docker","registry","npm","pkg","auth","sso","login","signin","account","accounts","id","identity",
"crm","erp","hr","payroll","billing","payment","payments","pay","checkout","cart","order","orders","track",
"tracking","monitor","monitoring","grafana","kibana","elastic","search","seo","ads","adserver","analytics",
"tracker","survey","forms","form","wiki","kb","faq","news","press","careers","jobs","events","forum","forums",
"community","chat","live","stream","video","tv","radio","music","game","games","play","mobile","android","ios",
"m2","old","new","legacy","archive","backup2","cdn2","cdn1","edge","origin","www2","ww1","ww2","mail2","smtp2",
"owa","exchange","office","o365","sharepoint","confluence","jira","bitbucket","github","gitea","sonarqube","vault",
"consul","nomad","terraform","aws","azure","gcp","s3","storage","cdn3","img","img1","img2","assets2","fonts",
"api2","api-v1","api-v2","v1","v2","graphql","rest","soap","ws","socket","websocket","rtmp","rtsp","ns","ns0",
"mta","mta1","relay","bounce","list","lists","newsletter","campaign","marketing","promo","landing","lp"
];

function setStatus(text, tone){
  statusLine.innerHTML = text;
  statusLine.style.color = tone === 'err' ? '#E0716B' : (tone === 'ok' ? 'var(--teal)' : 'var(--muted)');
}

function normalizeDomain(raw){
  let d = raw.trim().toLowerCase();
  d = d.replace(/^https?:\/\//,'').replace(/\/.*$/,'').replace(/^www\./,'');
  return d;
}

async function dohQuery(name, type){
  const url = `https://dns.google/resolve?name=${encodeURIComponent(name)}&type=${type}`;
  const res = await fetch(url, { headers: { 'accept': 'application/dns-json' } });
  if (!res.ok) throw new Error('DoH request failed: ' + res.status);
  return res.json();
}

async function pMapLimit(items, limit, fn){
  const results = new Array(items.length);
  let idx = 0;
  async function worker(){
    while (idx < items.length){
      const cur = idx++;
      results[cur] = await fn(items[cur], cur);
    }
  }
  const workers = Array.from({length: Math.min(limit, items.length)}, worker);
  await Promise.all(workers);
  return results;
}

function recordBadgeClass(type){
  const map = {A:'a', AAAA:'a', CNAME:'cname', MX:'mx', TXT:'txt', NS:'ns', SOA:'ns'};
  return map[type] || 'txt';
}

async function runDnsRecords(domain){
  dnsResults.innerHTML = '<div class="empty">Mengambil DNS record&hellip;</div>';
  const types = ['A','AAAA','MX','NS','TXT','CNAME','SOA'];
  const rows = [];
  await pMapLimit(types, 4, async (type) => {
    try{
      const data = await dohQuery(domain, type);
      if (data.Answer){
        data.Answer.forEach(ans => {
          rows.push({ type, name: ans.name.replace(/\.$/,''), ttl: ans.TTL, data: ans.data });
        });
      }
    }catch(e){ /* skip failed record type */ }
  });

  dnsCount.textContent = rows.length;
  if (rows.length === 0){
    dnsResults.innerHTML = '<div class="empty">Tidak ada record ditemukan.</div>';
    return;
  }
  const order = {A:0,AAAA:1,CNAME:2,MX:3,NS:4,TXT:5,SOA:6};
  rows.sort((a,b) => (order[a.type]??9) - (order[b.type]??9));

  let html = '<table><thead><tr><th>Type</th><th>Name</th><th>TTL</th><th>Value</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += `<tr><td><span class="badge ${recordBadgeClass(r.type)}">${r.type}</span></td><td>${r.name}</td><td>${r.ttl}</td><td style="word-break:break-all;">${escapeHtml(r.data)}</td></tr>`;
  });
  html += '</tbody></table>';
  dnsResults.innerHTML = html;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function runSubdomainScan(domain){
  lastSubdomainRows = [];
  subResults.innerHTML = '';
  subCount.textContent = '0';
  exportBtn.disabled = true;
  let found = 0, checked = 0;
  const total = WORDLIST.length;

  let table = document.createElement('table');
  table.innerHTML = '<thead><tr><th>Subdomain</th><th>Type</th><th>Alamat IP</th></tr></thead><tbody></tbody>';
  subResults.appendChild(table);
  const tbody = table.querySelector('tbody');

  await pMapLimit(WORDLIST, 20, async (prefix) => {
    const host = `${prefix}.${domain}`;
    try{
      const data = await dohQuery(host, 'A');
      checked++;
      subLog.textContent = `Memeriksa ${checked}/${total}&hellip;`;
      if (data.Answer && data.Answer.length){
        const ips = data.Answer.filter(a => a.type === 1).map(a => a.data);
        if (ips.length){
          found++;
          lastSubdomainRows.push({ host, ips: ips.join(', ') });
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${host}</td><td><span class="badge a">A</span></td><td>${ips.join(', ')}</td>`;
          tbody.appendChild(tr);
          subCount.textContent = found;
        }
      }
    }catch(e){
      checked++;
    }
  });

  subLog.textContent = `Selesai memeriksa ${total} kandidat.`;
  if (found === 0){
    subResults.innerHTML = '<div class="empty">Tidak ada subdomain yang cocok.</div>';
  } else {
    exportBtn.disabled = false;
  }
}

async function runScan(){
  const raw = domainInput.value;
  const domain = normalizeDomain(raw);
  if (!domain || !domain.includes('.')){
    setStatus('Masukkan domain yang valid, contoh: <b>example.com</b>', 'err');
    return;
  }
  scanBtn.disabled = true;
  scanBtn.textContent = 'Memproses…';
  setStatus(`Memeriksa <b>${domain}</b>&hellip;`);

  try{
    await Promise.all([ runDnsRecords(domain), runSubdomainScan(domain) ]);
    setStatus(`Selesai untuk <b>${domain}</b>.`, 'ok');
  }catch(e){
    setStatus('Gagal mengambil data. Coba lagi.', 'err');
  }finally{
    scanBtn.disabled = false;
    scanBtn.textContent = 'Jalankan';
  }
}

function exportCsv(){
  if (!lastSubdomainRows.length) return;
  let csv = 'subdomain,ip_address\n';
  lastSubdomainRows.forEach(r => { csv += `${r.host},"${r.ips}"\n`; });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'subdomains.csv';
  a.click();
  URL.revokeObjectURL(url);
}

scanBtn.addEventListener('click', runScan);
exportBtn.addEventListener('click', exportCsv);
domainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runScan(); });
</script>
</body>
</html>
